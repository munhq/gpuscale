apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpuscale.fullname" . }}-controller
  namespace: gpuscale-system
  labels:
    {{- include "gpuscale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gpuscale.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpuscale.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gpuscale.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --batch-window={{ .Values.controller.batchWindow }}
            - --cooldown-period={{ .Values.controller.cooldownPeriod }}
            - --interruption-poll-interval={{ .Values.controller.interruptionPollInterval }}
          env:
            {{- if .Values.providers.vastai.enabled }}
            - name: VASTAI_API_KEY
              {{- if .Values.providers.vastai.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.providers.vastai.existingSecret }}
                  key: {{ .Values.providers.vastai.existingSecretKey | default "api-key" }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpuscale.fullname" . }}-provider-credentials
                  key: vastai-api-key
              {{- end }}
            {{- end }}
            {{- if .Values.providers.verda.enabled }}
            - name: VERDA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpuscale.fullname" . }}-provider-credentials
                  key: verda-client-id
            - name: VERDA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpuscale.fullname" . }}-provider-credentials
                  key: verda-client-secret
            {{- end }}
            {{- if .Values.providers.runpod.enabled }}
            - name: RUNPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gpuscale.fullname" . }}-provider-credentials
                  key: runpod-api-key
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
