apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpunodepools.gpuscale.io
  labels:
    {{- include "gpuscale.labels" . | nindent 4 }}
spec:
  group: gpuscale.io
  names:
    kind: GPUNodePool
    listKind: GPUNodePoolList
    plural: gpunodepools
    singular: gpunodepool
    shortNames:
      - gnp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Max Nodes
          type: integer
          jsonPath: .spec.scaling.maxNodes
        - name: Active
          type: integer
          jsonPath: .status.activeNodes
        - name: GPUs
          type: integer
          jsonPath: .status.totalGPUs
        - name: Cost/hr
          type: string
          jsonPath: .status.currentCostPerHour
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["providers", "requirements", "scaling", "bootstrap"]
              properties:
                providers:
                  type: array
                  items:
                    type: object
                    required: ["name", "apiKeySecret"]
                    properties:
                      name:
                        type: string
                      apiKeySecret:
                        type: object
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                      capacityType:
                        type: string
                        enum: ["spot", "on-demand"]
                        default: "spot"
                      maxPrice:
                        type: number
                requirements:
                  type: object
                  properties:
                    gpuTypes:
                      type: array
                      items:
                        type: string
                    minVRAM:
                      type: integer
                    minDisk:
                      type: integer
                    minRAM:
                      type: integer
                scaling:
                  type: object
                  required: ["maxNodes"]
                  properties:
                    batchWindow:
                      type: string
                      default: "10s"
                    cooldownPeriod:
                      type: string
                      default: "10m"
                    maxNodes:
                      type: integer
                    minNodes:
                      type: integer
                      default: 0
                    interruptionPollInterval:
                      type: string
                      default: "30s"
                bootstrap:
                  type: object
                  required: ["image", "vpnSetupKeySecret", "k3sTokenSecret", "k3sURL"]
                  properties:
                    image:
                      type: string
                    vpnSetupKeySecret:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    k3sTokenSecret:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                    k3sURL:
                      type: string
                    modelCacheURL:
                      type: string
                limits:
                  type: object
                  properties:
                    maxGPUs:
                      type: integer
                    maxCostPerHour:
                      type: number
            status:
              type: object
              properties:
                activeNodes:
                  type: integer
                totalGPUs:
                  type: integer
                currentCostPerHour:
                  type: number
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
