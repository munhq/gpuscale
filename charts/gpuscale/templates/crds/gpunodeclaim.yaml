apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpunodeclaims.gpuscale.io
  labels:
    {{- include "gpuscale.labels" . | nindent 4 }}
spec:
  group: gpuscale.io
  names:
    kind: GPUNodeClaim
    listKind: GPUNodeClaimList
    plural: gpunodeclaims
    singular: gpunodeclaim
    shortNames:
      - gnc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pool
          type: string
          jsonPath: .spec.poolRef
        - name: Provider
          type: string
          jsonPath: .status.provider
        - name: GPU
          type: string
          jsonPath: .status.gpuType
        - name: Price/hr
          type: string
          jsonPath: .status.pricePerHour
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Node
          type: string
          jsonPath: .status.nodeName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["poolRef", "requirements"]
              properties:
                poolRef:
                  type: string
                requirements:
                  type: object
                  properties:
                    gpuCount:
                      type: integer
                    minVRAM:
                      type: integer
                    gpuTypes:
                      type: array
                      items:
                        type: string
                    maxPrice:
                      type: number
                podRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      uid:
                        type: string
            status:
              type: object
              properties:
                provider:
                  type: string
                instanceID:
                  type: string
                nodeName:
                  type: string
                gpuType:
                  type: string
                gpuCount:
                  type: integer
                pricePerHour:
                  type: number
                phase:
                  type: string
                  enum: ["Pending", "Provisioning", "Bootstrapping", "Ready", "Draining", "Terminated"]
                provisionedAt:
                  type: string
                  format: date-time
                readyAt:
                  type: string
                  format: date-time
                idleSince:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
