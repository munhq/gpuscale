apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpunodeclaims.gpuscale.io
  labels:
    {{- include "gpuscale.labels" . | nindent 4 }}
spec:
  group: gpuscale.io
  names:
    kind: GPUNodeClaim
    listKind: GPUNodeClaimList
    plural: gpunodeclaims
    singular: gpunodeclaim
    shortNames:
      - gnc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pool
          type: string
          jsonPath: .spec.poolRef
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Type
          type: string
          jsonPath: .status.nodeType
        - name: GPU
          type: string
          jsonPath: .status.gpuType
        - name: Price/hr
          type: string
          jsonPath: .status.pricePerHour
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Node/Endpoint
          type: string
          jsonPath: .status.nodeName
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["poolRef", "requirements"]
              properties:
                poolRef:
                  type: string
                provider:
                  type: string
                  description: Provider name, set at creation time to survive status update failures.
                nodeType:
                  type: string
                  enum: ["standalone"]
                  description: Deployment mode, set at creation time to survive status update failures.
                modelId:
                  type: string
                  description: Model this claim was provisioned for.
                modelIds:
                  type: array
                  items:
                    type: string
                  description: All model IDs co-located on this node (multi-model bin-packing).
                modelSource:
                  type: string
                  description: HuggingFace source for the model (e.g. hf:Qwen/Qwen3-Coder-Next).
                requirements:
                  type: object
                  properties:
                    gpuCount:
                      type: integer
                    minVRAM:
                      type: integer
                    maxVRAM:
                      type: integer
                      description: Maximum VRAM per GPU in GB. Prevents over-provisioning.
                    gpuTypes:
                      type: array
                      items:
                        type: string
                    maxPrice:
                      type: number
                    minDisk:
                      type: integer
                      description: Minimum OS volume size in GB. Used by VM providers to size the disk at creation time.
                podRefs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      uid:
                        type: string
            status:
              type: object
              properties:
                provider:
                  type: string
                instanceID:
                  type: string
                nodeType:
                  type: string
                  enum: ["standalone"]
                nodeName:
                  type: string
                endpoint:
                  type: string
                gpuType:
                  type: string
                gpuCount:
                  type: integer
                pricePerHour:
                  type: number
                phase:
                  type: string
                  enum: ["Pending", "Provisioning", "Bootstrapping", "Ready", "Draining", "Terminated", "Hibernated"]
                provisionedAt:
                  type: string
                  format: date-time
                readyAt:
                  type: string
                  format: date-time
                idleSince:
                  type: string
                  format: date-time
                retryCount:
                  type: integer
                  description: Tracks provisioning retry count for exponential backoff.
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
