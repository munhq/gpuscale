{{- if or .Values.providers.vastai.apiKey .Values.providers.verda.clientID .Values.providers.runpod.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gpuscale.fullname" . }}-provider-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpuscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.providers.vastai.apiKey }}
  vastai-api-key: {{ .Values.providers.vastai.apiKey | quote }}
  {{- end }}
  {{- if .Values.providers.verda.clientID }}
  verda-client-id: {{ .Values.providers.verda.clientID | quote }}
  verda-client-secret: {{ .Values.providers.verda.clientSecret | quote }}
  {{- end }}
  {{- if .Values.providers.runpod.apiKey }}
  runpod-api-key: {{ .Values.providers.runpod.apiKey | quote }}
  {{- end }}
{{- end }}
