# Hybrid pool: Vast.ai for cheap spot + Verda for on-demand fallback.
# Both providers run standalone ray-worker vLLM instances.
# GPUScale tries Vast.ai first (cheaper), falls back to Verda if no offers.
apiVersion: gpuscale.io/v1alpha1
kind: GPUNodePool
metadata:
  name: hybrid-inference-pool
spec:
  providers:
    # Vast.ai spot — cheapest, but less reliable
    - name: vast.ai
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 0.30

    # Verda on-demand — more expensive, guaranteed availability
    - name: verda
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: on-demand
      maxPrice: 1.00

  requirements:
    gpuTypes: ["RTX 4090", "RTX 3090", "A100"]
    minVRAM: 24

  scaling:
    batchWindow: "10s"
    cooldownPeriod: "10m"
    maxNodes: 20
    minNodes: 0
    interruptionPollInterval: "30s"

  bootstrap:
    image: "rayproject/ray-llm:2.53.0-py311-cu128"
    rayConfig:
      servePort: 8000
    modelConfig:
      modelId: "THUDM/glm-4-9b-chat"
      modelSource: "THUDM/glm-4-9b-chat"
      maxModelLen: 8192
      dtype: auto
      gpuMemoryUtilization: 0.90
      enablePrefixCaching: true
      maxOngoingRequests: 64

  limits:
    maxGPUs: 20
    maxCostPerHour: 10.00
