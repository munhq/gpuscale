apiVersion: gpuscale.io/v1alpha1
kind: GPUNodePool
metadata:
  name: hybrid-inference-pool
spec:
  # Multiple providers with different node types
  providers:
    # Vast.ai with ray-worker mode (containers work!)
    - name: vast.ai
      nodeType: ray-worker  # Run Ray Serve directly, no K3s
      apiKeySecret:
        name: gpuscale-vastai-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 0.30  # $/hr per GPU

    # Verda with k3s mode (VMs join cluster)
    - name: verda
      nodeType: k3s  # Full K3s integration
      apiKeySecret:
        name: gpuscale-verda-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 1.00

  # GPU requirements (applied to all providers)
  requirements:
    gpuTypes: ["RTX 4090", "RTX 3090", "A100"]
    minVRAM: 24  # GB

  # Scaling behavior
  scaling:
    batchWindow: "10s"
    cooldownPeriod: "10m"
    maxNodes: 20
    minNodes: 0
    interruptionPollInterval: "30s"

  # Bootstrap configuration
  bootstrap:
    # For ray-worker nodes (Vast.ai)
    image: "rayproject/ray:latest-gpu"

    # Ray configuration (only for ray-worker type)
    rayConfig:
      dashboardPort: 8265
      servePort: 8000
      # Leave headAddress empty = run as standalone head nodes

    # For k3s nodes (Verda) - also include these fields
    vpnSetupKeySecret:
      name: gpuscale-netbird-key
      namespace: gpuscale-system
    k3sTokenSecret:
      name: gpuscale-k3s-token
      namespace: gpuscale-system
    k3sURL: "https://10.100.0.1:6443"

    # Optional: pre-cache models
    modelCacheURL: "s3:your-bucket/models"

  # Limits
  limits:
    maxGPUs: 20
    maxCostPerHour: 10.00
