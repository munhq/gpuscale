# Multi-provider GPUNodePool using Vast.ai + Verda + RunPod.
# GPUScale selects the cheapest matching offer across all providers.
apiVersion: gpuscale.io/v1alpha1
kind: GPUNodePool
metadata:
  name: multi-provider-pool
spec:
  providers:
    - name: vast.ai
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 0.50
    - name: verda
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 1.00
    - name: runpod
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 0.80

  requirements:
    gpuTypes: ["RTX 4090", "A100", "H100", "L40S"]
    minVRAM: 24
    minDisk: 50
    minRAM: 32

  scaling:
    batchWindow: "10s"
    cooldownPeriod: "5m"
    maxNodes: 20
    minNodes: 0

  bootstrap:
    image: "rayproject/ray-llm:2.53.0-py311-cu128"
    rayConfig:
      servePort: 8000
    modelConfig:
      modelId: "meta-llama/Llama-3.1-8B-Instruct"
      maxModelLen: 8192
      dtype: auto
      gpuMemoryUtilization: 0.90
      enablePrefixCaching: true
    modelCacheURL: "s3:my-bucket/models"

  limits:
    maxGPUs: 40
    maxCostPerHour: 10.00
