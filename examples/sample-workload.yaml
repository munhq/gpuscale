apiVersion: v1
kind: Pod
metadata:
  name: gpu-inference-test
  annotations:
    gpuscale.io/gpu-vram: "24"
    gpuscale.io/gpu-type: "RTX 4090"
    gpuscale.io/max-price: "0.50"
    gpuscale.io/priority: "spot"
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: inference
      image: vllm/vllm-openai:latest
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model"
        - "meta-llama/Llama-3.1-8B-Instruct"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
      resources:
        limits:
          nvidia.com/gpu: 1
      ports:
        - containerPort: 8000
          name: http
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-large-model
  annotations:
    gpuscale.io/gpu-vram: "80"
    gpuscale.io/max-price: "1.50"
    gpuscale.io/priority: "spot"
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: inference
      image: vllm/vllm-openai:latest
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model"
        - "meta-llama/Llama-3.3-70B-Instruct"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--tensor-parallel-size"
        - "1"
      resources:
        limits:
          nvidia.com/gpu: 1
      ports:
        - containerPort: 8000
          name: http
