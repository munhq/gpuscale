# Single-provider GPUNodePool using Vast.ai spot instances.
# Workers are standalone vLLM instances running Ray Serve.
apiVersion: gpuscale.io/v1alpha1
kind: GPUNodePool
metadata:
  name: inference-pool
spec:
  providers:
    - name: vast.ai
      nodeType: ray-worker
      apiKeySecret:
        name: gpuscale-provider-credentials
        namespace: gpuscale-system
      capacityType: spot
      maxPrice: 0.50

  requirements:
    gpuTypes: ["RTX 4090", "RTX 3090", "A100"]
    minVRAM: 24
    minDisk: 50
    minRAM: 32

  scaling:
    batchWindow: "10s"
    cooldownPeriod: "10m"
    maxNodes: 10
    minNodes: 0
    interruptionPollInterval: "30s"

  bootstrap:
    image: "rayproject/ray-llm:2.53.0-py311-cu128"
    rayConfig:
      servePort: 8000
    modelConfig:
      modelId: "THUDM/glm-4-9b-chat"
      modelSource: "THUDM/glm-4-9b-chat"
      maxModelLen: 8192
      dtype: auto
      gpuMemoryUtilization: 0.90
      enablePrefixCaching: true
      maxOngoingRequests: 64

  limits:
    maxGPUs: 20
    maxCostPerHour: 5.00
