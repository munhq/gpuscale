name: Build and Push Controller

# Publishes ghcr.io/munhq/gpuscale-controller:latest, the image the production
# cluster runs. `release.yml` still publishes version tags on `v*`; this
# workflow keeps `:latest` current with main.

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'docker/**'
      - '.github/workflows/build-controller.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Derive the name from the repository. Two repositories that hardcode the
  # same literal write one package, and the second silently replaces the
  # first one's image.
  IMAGE_NAME: ${{ github.repository_owner }}/gpuscale-controller

jobs:
  build:
    # GitHub-hosted on purpose. GitHub withholds org self-hosted runners from
    # public repositories by default, so a `hotmun-arc` job here queues for
    # ever — and enabling it would let a fork's pull request run code inside
    # the production cluster.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/controller/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          no-cache: true

      # No keel webhook here. Keel's native webhook is a ClusterIP inside the
      # production cluster, which a GitHub-hosted runner cannot reach, and
      # keel's own registry poll currently 403s on a stale credential. Until
      # that credential is fixed, roll the controller by hand after a build:
      #   kubectl rollout restart deploy/gpuscale-controller -n gpu-workloads
